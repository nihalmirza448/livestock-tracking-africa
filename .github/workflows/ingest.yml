name: EO ingest

on:
  schedule:
    - cron: "0 2 * * *" # 04:00 Sudan time, ahead of the 08:00 refresh target
    - cron: "0 3 1 * *" # monthly: static and annual reference layers
  workflow_dispatch:
    inputs:
      sources:
        description: "Comma-separated source keys (blank = daily set)"
        required: false
      since:
        description: "Backfill from date (YYYY-MM-DD)"
        required: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      sources: ${{ steps.pick.outputs.sources }}
    steps:
      - id: pick
        env:
          INPUT_SOURCES: ${{ github.event.inputs.sources }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -n "$INPUT_SOURCES" ]; then
            list=$(echo "$INPUT_SOURCES" | tr -d ' ' | tr ',' '\n' | sed 's/.*/"&"/' | paste -sd,)
          elif [ "$SCHEDULE" = "0 3 1 * *" ]; then
            list='"aster_dem","cci_landcover","hwsd","grace_mascon"'
          else
            list='"gpm_imerg","chirps3","gldas_clsm","modis_ndvi","modis_et"'
          fi
          echo "sources=[$list]" >> "$GITHUB_OUTPUT"
          echo "Running: [$list]"

  ingest:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(needs.plan.outputs.sources) }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
      EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
      CDS_API_KEY: ${{ secrets.CDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingest/requirements.txt
      - run: pip install -r ingest/requirements.txt
      - run: python -m ingest.run --sources "${{ matrix.source }}" ${{ github.event.inputs.since && format('--since {0}', github.event.inputs.since) || '' }}
