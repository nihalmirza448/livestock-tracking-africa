name: EO ingest

on:
  schedule:
    - cron: "0 2 * * *" # 04:00 Sudan time, ahead of the 08:00 refresh target
    - cron: "0 3 1 * *" # monthly: static and annual reference layers
  workflow_dispatch:
    inputs:
      sources:
        description: "Comma-separated source keys (blank = daily set)"
        required: false
      since:
        description: "Backfill from date (YYYY-MM-DD)"
        required: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(
          github.event.inputs.sources && format('["{0}"]', github.event.inputs.sources) ||
          github.event.schedule == '0 3 1 * *' && '["aster_dem","cci_landcover","hwsd","grace_mascon"]' ||
          '["gpm_imerg","chirps","gldas_clsm","modis_ndvi","modis_et"]') }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
      EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
      CDS_API_KEY: ${{ secrets.CDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingest/requirements.txt
      - run: pip install -r ingest/requirements.txt
      - name: Check data servers
        continue-on-error: true
        run: |
          curl -s -o /dev/null -w "CMR anonymous search: %{http_code}\n" \
            "https://cmr.earthdata.nasa.gov/search/granules.json?short_name=GPM_3IMERGDL&page_size=1"
          curl -s -o /dev/null -w "CHIRPS v2 daily COG index: %{http_code}\n" \
            "https://data.chc.ucsb.edu/products/CHIRPS-2.0/global_daily/cogs/p05/$(date +%Y)/"
          curl -s -o /dev/null -w "CHIRPS v3 index: %{http_code}\n" \
            "https://data.chc.ucsb.edu/products/CHIRPS/v3.0/daily/"
      - run: python -m ingest.run --sources "${{ matrix.source }}" ${{ github.event.inputs.since && format('--since {0}', github.event.inputs.since) || '' }}
